[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satpredict-modern"
version = "0.1.0"
description = "Modernized target-centric satellite overpass predictor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.112", "uvicorn>=0.30"]

[project.scripts]
satpredict = "satpredict.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
